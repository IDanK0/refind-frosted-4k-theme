#
# rEFInd — boot menu at 3840x2160
#
# GEOMETRY (from refind/menu.c). The frosted tiles and the "Windows"/"Ubuntu"
# labels are BAKED into background.png at fixed coordinates, so if you change
# big_icon_size or small_icon_size you must regenerate everything with
# ./build.py — it recomputes the coordinates and refuses to write anything if
# the spacing no longer works out.
#   TileSizes[0] = 549*9/8 = 617    row0PosY = 1080 - 308 = 772
#   TileSizes[1] =  48*4/3 =  64    row1PosY = 772 + 617 + 16 = 1405
#   row0PosX = 1299   tile centres = 1607 and 2232
#   textPosY = 1405 + 64 + 16 = 1485
# big_icon_size 549 is not an aesthetic choice: it is the value that puts the
# tool row 52px below the labels, the same gap that separates the labels from
# the tiles. Limit: MaxVisible = 3840/(617+8)-1 = 5, which must stay >= 2.
#
# NO "showtools" line: this build ignores it (it zeroes the tool table with no
# effect) and the five default tools are wanted. Adding it would change
# row1Count and throw everything baked into the background out of alignment.
#
# 'label' is deliberately NOT in hideui: it makes the name of the selected
# entry appear at textPosY. It is a single switch (menu.c, PaintAll), so it
# applies to Windows and Ubuntu too, which show the hardcoded string
# "Boot <name> from <volume>" (config.c:964). The volume name comes from the
# GPT partition name of the ESP, so renaming that partition to something short
# is the only way to keep the line from running long.
#
log_level 0

timeout 25
resolution 3840 2160
scanfor manual

banner       background.png
banner_scale fillscreen

# BLACK glyphs: rEFInd inverts the font on dark backgrounds (libeg/text.c)
font font.png

selection_big   selection_big.png
selection_small selection_small.png

big_icon_size   549
small_icon_size 48

use_graphics_for linux,windows
hideui hints,badges

default_selection Windows

menuentry "Windows" {
    icon   /EFI/refind/icon_windows.png
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "Ubuntu" {
    icon   /EFI/refind/icon_ubuntu.png
    loader /EFI/ubuntu/grubx64.efi
}
