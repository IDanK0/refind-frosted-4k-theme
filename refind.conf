#
# rEFInd - DESKTOP - menu di avvio a 3840x2160 nativi
#
# GEOMETRIA (da refind/menu.c). Lastre di vetro ed etichette "Windows"/"Ubuntu"
# sono COTTE dentro background.png a coordinate fisse: se tocchi big_icon_size
# o small_icon_size va rigenerato tutto con ~/.cache/refind-build/build.py.
#   TileSizes[0] = 549*9/8 = 617    row0PosY = 1080 - 308 = 772
#   TileSizes[1] =  48*4/3 =  64    row1PosY = 772 + 617 + 16 = 1405
#   centri lastre = 1607 e 2232     textPosY = 1405 + 64 + 16 = 1485
# big_icon_size 549 non e' estetico: e' il valore che mette la fila di
# strumenti a 52 px sotto le scritte, cioe' la stessa distanza che separa
# le scritte dalle lastre. Vincolo: MaxVisible = 3840/(617+8)-1 = 5, ok.
#
# NIENTE riga "showtools": questa build la ignora (azzera la tabella senza
# effetto) e i 5 strumenti predefiniti sono voluti. Aggiungerla cambierebbe
# row1Count e disallineerebbe tutto quanto e' cotto nello sfondo.
#
# 'label' NON e' in hideui: serve a far comparire il nome della voce
# selezionata a textPosY. E' un interruttore unico (menu.c, PaintAll), quindi
# vale anche per Windows e Ubuntu, che mostrano la stringa cablata
# "Boot <nome> from <volume>" (config.c:964). Per accorciarla il nome GPT
# della partizione EFI e' stato rinominato in "DESKTOP".
#

log_level 0

timeout 25
resolution 3840 2160
scanfor manual

banner       background.png
banner_scale fillscreen

# Glifi NERI: rEFInd inverte il font sugli sfondi scuri (libeg/text.c)
font font.png

selection_big   selection_big.png
selection_small selection_small.png

big_icon_size   549
small_icon_size 48

use_graphics_for linux,windows
hideui hints,badges

default_selection Windows

menuentry "Windows" {
    icon   /EFI/refind/icon_windows.png
    loader /EFI/Microsoft/Boot/bootmgfw.efi
}

menuentry "Ubuntu" {
    icon   /EFI/refind/icon_ubuntu.png
    loader /EFI/ubuntu/grubx64.efi
}
