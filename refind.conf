#
# rEFInd — 4K boot menu, adaptive
#
# NOTHING is baked into the background. The frosted plate and the OS name live
# inside each icon, because rEFInd re-centres the row every time the number of
# entries changes:
#
#   row0PosX = (UGAWidth + 8 - (TileSizes[0] + 8) * row0Count) / 2
#
# With two entries the row starts at x=1299, with three at x=986. Anything
# painted into the background at a fixed position would be left behind the
# moment a USB stick is plugged in. Putting the plate in the icon makes the
# theme correct at any count, at any position, for ever.
#
# GEOMETRY (refind/menu.c)
#   TileSizes[0] = 549*9/8 = 617    row0PosY = 1080 - 308 = 772
#   TileSizes[1] =  48*4/3 =  64    row1PosY = 772 + 617 + 16 = 1405
#   textPosY     = 1405 + 64 + 16 = 1485
#   MaxVisible   = 3840/(617+8) - 1 = 5 entries before it scrolls
#
# NO "showtools" line: this build ignores it (it zeroes the tool table with no
# effect), and the five default tools are wanted.
#
# 'label' is deliberately NOT in hideui: it puts the name of the selected entry
# at textPosY. That is what names anything rEFInd discovers on its own — a USB
# stick, a system installed next year — since only the icons carry baked names.
#

log_level 0

timeout 25
resolution 3840 2160

# Find everything: internal disks, USB sticks and optical media, plus any
# manual stanza added below. This is what makes the menu adaptive.
scanfor internal,external,optical,manual

# One entry per operating system rather than one per kernel.
scan_all_linux_kernels false

# Frosted glass, done by rEFInd itself at draw time. The blur cannot live in
# the icon — the icon is generated before anyone knows where it will be drawn —
# but by the time an entry is painted the background has already been cropped
# to the exact tile, so the blur is correct at any position and any entry count.
# Requires the patched binary built by build-refind.sh.
# Before handing over, show the system you chose on its own -- the same tile
# the menu drew, with a ring of dots turning under it -- for this many
# milliseconds. This is the boot logo of everything: Windows, a stick, a
# system installed next year, since rEFInd is the only thing that runs before
# all of them. 1800 is one full turn of the ring. 0 switches it off.
# The menu arrives, the selection moves and the chosen tile travels to the
# middle instead of jumping. Every one of those stops the instant a keystroke
# is waiting, so holding an arrow key is exactly as fast as it ever was.
animations true

# Cross-fade the whole screen when the menu appears and when it goes away.
# It looks lovely and it costs eight full 4K screens -- 264 MB pushed through
# the framebuffer before anything is on it, which on a real machine is the
# slow wipe from top to bottom you were never meant to see. Off by default;
# the menu still fades its own tiles in, which is the part you notice.
fade false

# The dot the spinner is made of. build.py writes it in the colour it took
# from the photograph, so the ring belongs to the picture like everything
# else. Without this rEFInd draws a plain white one.
handoff_dot dot.png

# How long to wait, after the photograph is up, before the menu arrives.
#
# A monitor takes a second or two to lock onto a signal and shows nothing at all
# until it has, while the firmware has been drawing the whole time. On a slow
# display the menu's arrival happens entirely inside that darkness and the first
# thing you ever see is a finished menu, which looks exactly like an animation
# nobody wrote. This is the beat of wallpaper before the menu lands on it. 0
# arrives at once; a keypress ends the wait immediately either way.
entrance_delay 0

# Hand the screen to the system that boots next.
#
# Windows does not choose the picture it shows while it starts: it reads one out
# of an ACPI table the firmware fills in with the maker's logo, which is why a
# laptop shows its own badge during a Windows boot. A bootloader is the last
# thing to run before the operating system, so it is the last thing that can
# write to that table -- and writing the screen there means Windows shows the
# screen. Nothing is installed inside Windows and nothing survives reinstalling
# it, because there is nothing there to survive.
#
# Windows keeps turning its own ring of dots underneath and cannot be asked not
# to, so what is handed over is the picture without ours. false leaves the
# firmware's own logo alone.
bgrt_logo true

handoff_splash 1800

frost_radius 14
# The stencil that says where the glass is. Its alpha is the panel's shape at
# full strength, not the panel's own translucency -- glass scatters everything
# behind it and tints afterwards, so the tint comes from the icon composited
# over the top. Drop this line and the menu draws without frost.
frost_mask_big frost_big.png

banner       background.png
banner_scale fillscreen

# BLACK glyphs: rEFInd inverts the font on dark backgrounds (libeg/text.c)
font font.png

selection_big   selection_big.png
selection_small selection_small.png

big_icon_size   549
small_icon_size 48

use_graphics_for linux,windows
hideui hints,badges

default_selection Windows

# No manual menuentry blocks. Everything above is discovered, so the menu
# reflects whatever is actually attached to the machine. Add a stanza here only
# to override something rEFInd gets wrong.

# Everything the settings screen in the boot menu can change lives here, in a
# file of its own. It is read last, so it wins; delete it and the machine comes
# back to what was installed. build.py writes a first one from its own defaults.
include theme.conf
